<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>BENELOIL 3000</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#bfe0ee;font-family:system-ui,-apple-system,'Segoe UI',sans-serif}
  #c{position:fixed;inset:0;width:100%;height:100%;display:block}
  /* vinyet */
  #vig{position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse at center,transparent 58%,rgba(20,30,25,.28) 100%)}
  /* sayaç çipi */
  #chip{position:fixed;left:50%;bottom:34px;transform:translateX(-50%);background:#faf6ec;border-radius:16px;
    padding:10px 22px 12px;box-shadow:0 3px 0 #d9d2bf,0 10px 30px rgba(0,0,0,.18);text-align:center;opacity:0;transition:opacity .6s}
  #chip .n{font-size:34px;font-weight:900;color:#d64545;letter-spacing:1px;font-variant-numeric:tabular-nums;line-height:1}
  #chip .l{font-size:11px;font-weight:700;color:#8a8474;letter-spacing:2.5px;margin-top:4px}
  /* marka çipi */
  #brand{position:fixed;left:26px;top:24px;background:#d64545;color:#faf6ec;font-weight:900;letter-spacing:1.5px;
    padding:9px 16px 10px;border-radius:12px;box-shadow:0 3px 0 #a83636,0 8px 24px rgba(0,0,0,.2);font-size:16px}
  /* final başlık */
  #final{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;
    padding-bottom:6vh;pointer-events:none;opacity:0;transition:opacity 1.4s}
  #final .s{font-size:min(3.8vw,28px);font-weight:800;color:#fffdf6;text-shadow:0 2px 12px rgba(0,0,0,.45)}
  #final .u{margin-top:16px;background:#faf6ec;color:#d64545;font-weight:900;letter-spacing:1px;
    padding:10px 22px;border-radius:14px;box-shadow:0 3px 0 #d9d2bf,0 10px 30px rgba(0,0,0,.25);font-size:min(3vw,20px)}
  .hide{display:none!important}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="vig"></div>
<div id="brand">BENELOIL</div>
<div id="chip"><div class="n">0</div><div class="l">BENZİN İSTASYONU</div></div>
<div id="final">
  <div class="s" id="subt">3.000 oyuncuya teşekkürler ❤️</div>
  <div class="u">beneloil.com</div>
</div>
<script type="module">
import * as THREE from './three.module.min.js'

const Q = new URLSearchParams(location.search)
if (Q.get('clean')) for (const id of ['chip','brand']) document.getElementById(id).classList.add('hide')
if (Q.get('sub')) document.getElementById('subt').textContent = Q.get('sub')
const DUR = +(Q.get('dur') || 30)          // toplam yükseliş süresi (sn)
const FREEZE = Q.has('t') ? +Q.get('t') : null // ?t=12 → 12. saniyede dondur (test/kapak karesi)

// ---- deterministik RNG: her kayıtta aynı sahne ----
let seed = 30003
const rnd = () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296 }

// ---- "BENELOIL" + "3000" piksel yerleşimi → TAM 3000 hücre ----
const TARGET = 3000
function sampleCells (fpx) {
  const cv = document.createElement('canvas'); const g = cv.getContext('2d', { willReadFrequently: true })
  const f2 = fpx * 1.25 // "3000" satırı biraz daha iri
  cv.width = Math.ceil(fpx * 7.2); cv.height = Math.ceil(fpx * 2.75)
  g.clearRect(0, 0, cv.width, cv.height)
  g.fillStyle = '#fff'; g.textAlign = 'center'; g.textBaseline = 'alphabetic'
  g.font = `900 ${fpx}px 'Arial Black','Arial',sans-serif`
  g.fillText('BENELOIL', cv.width / 2, fpx * 1.02)
  g.font = `900 ${f2}px 'Arial Black','Arial',sans-serif`
  g.fillText('3000', cv.width / 2, fpx * 1.02 + f2 * 1.18)
  const d = g.getImageData(0, 0, cv.width, cv.height).data
  const cells = []
  for (let y = 0; y < cv.height; y++) for (let x = 0; x < cv.width; x++)
    if (d[(y * cv.width + x) * 4 + 3] > 128) cells.push({ x, y })
  return { cells, w: cv.width, h: cv.height }
}
let lo = 14, hi = 90, pick = null
for (let i = 0; i < 22; i++) {
  const f = (lo + hi) / 2, s = sampleCells(f)
  if (s.cells.length >= TARGET) { pick = s; hi = f } else lo = f
}
// fazlalığı kenar piksellerinden (komşusu az olanlardan) tıraşla → TAM 3000
{
  const set = new Set(pick.cells.map(c => c.y * 10000 + c.x))
  for (const c of pick.cells) {
    c.nb = 0
    for (let dy = -1; dy <= 1; dy++) for (let dx = -1; dx <= 1; dx++)
      if ((dx || dy) && set.has((c.y + dy) * 10000 + c.x + dx)) c.nb++
    c.r = rnd()
  }
  pick.cells.sort((a, b) => (b.nb - a.nb) || (a.r - b.r))
  pick.cells = pick.cells.slice(0, TARGET)
}
const CELLS = pick.cells
const S = 13 // hücre aralığı (m) — istasyon ~9 m
const W = pick.w * S, H = pick.h * S
const toWorld = c => ({ x: (c.x - pick.w / 2) * S, z: (c.y - pick.h / 2) * S })

// ---- sahne ----
const renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('c'), antialias: true })
renderer.setPixelRatio(Math.min(devicePixelRatio, 2))
const scene = new THREE.Scene()
scene.background = new THREE.Color(0xbfe0ee)
scene.fog = new THREE.Fog(0xbfe0ee, 1400, 6200)
const cam = new THREE.PerspectiveCamera(55, 1, 0.5, 12000)
function resize () { const w = innerWidth, h = innerHeight; renderer.setSize(w, h, false); cam.aspect = w / h; cam.updateProjectionMatrix() }
addEventListener('resize', resize); resize()

scene.add(new THREE.HemisphereLight(0xdff0fa, 0x6d9155, 0.95))
const sun = new THREE.DirectionalLight(0xfff2dd, 1.05); sun.position.set(0.9, 1.5, 0.6); scene.add(sun)

// ---- zemin: çim + yol ızgarası tek dokuda ----
const EXT = 2.6 // zemin, yazı alanından bolca taşsın
{
  const TX = 4096
  const cv = document.createElement('canvas'); cv.width = cv.height = TX
  const g = cv.getContext('2d')
  g.fillStyle = '#79a25e'; g.fillRect(0, 0, TX, TX)
  for (let i = 0; i < 5200; i++) { // çim benekleri
    g.fillStyle = ['#93bd77', '#6d9155', '#84ad68'][(rnd() * 3) | 0]
    g.globalAlpha = 0.3 + rnd() * 0.3
    const r = 10 + rnd() * 46; g.beginPath(); g.arc(rnd() * TX, rnd() * TX, r, 0, 7); g.fill()
  }
  g.globalAlpha = 1
  const px = (TX / (W * EXT)) * S // 1 hücre kaç doku pikseli
  const cx = TX / 2, cy = TX / 2
  const road = (x0, y0, x1, y1, w) => { g.fillRect(x0 - w / 2, y0 - w / 2, (x1 - x0) + w, (y1 - y0) + w) }
  // seyrek ana caddeler — düşük kontrast, waffle görüntüsü yok
  const step = px * 8, n = Math.ceil(cx / step)
  g.fillStyle = '#4a5058'; g.globalAlpha = 0.5
  for (let i = -n; i <= n; i++) { road(cx + i * step + px / 2, 0, cx + i * step + px / 2, TX, px * 0.45); road(0, cy + i * step + px / 2, TX, cy + i * step + px / 2, px * 0.45) }
  g.globalAlpha = 1
  const tex = new THREE.CanvasTexture(cv); tex.colorSpace = THREE.SRGBColorSpace
  tex.anisotropy = renderer.capabilities.getMaxAnisotropy()
  const ground = new THREE.Mesh(new THREE.PlaneGeometry(W * EXT, W * EXT), new THREE.MeshLambertMaterial({ map: tex }))
  ground.rotation.x = -Math.PI / 2; ground.position.y = -0.05; scene.add(ground)
}

// ---- istasyon parçaları (hepsi instanced, 3000'er adet) ----
const lam = c => new THREE.MeshLambertMaterial({ color: c })
const parts = []
function inst (geo, mat, place) { const m = new THREE.InstancedMesh(geo, mat, TARGET); m.instanceMatrix.setUsage(THREE.StaticDrawUsage); parts.push({ m, place }); scene.add(m); return m }
const M4 = new THREE.Matrix4(), P = new THREE.Vector3(), QT = new THREE.Quaternion(), SC = new THREE.Vector3(1, 1, 1), EU = new THREE.Euler()
// asfalt ped
inst(new THREE.BoxGeometry(10.6, 0.12, 10.6), lam(0x3f454c), (o) => ({ p: [o.x, 0.06, o.z], ry: 0 }))
// kanopi tepesi KIRMIZI (gökyüzünden yazıyı bu okutuyor) + krem şerit
inst(new THREE.BoxGeometry(8.6, 0.5, 6.4), lam(0xd64545), (o) => ({ p: [o.x, 4.1, o.z - 0.6], ry: o.ry }))
inst(new THREE.BoxGeometry(8.8, 0.22, 1.1), lam(0xfaf6ec), (o) => ({ p: [o.x, 4.12, o.z + 2.05 * o.dz - 0.6 * (1 - Math.abs(o.dz)) ], ry: o.ry }))
// kanopi kolonları
{
  const g = new THREE.CylinderGeometry(0.22, 0.22, 3.9, 6)
  inst(g, lam(0xe8e4d8), (o) => ({ p: [o.x - 3.1, 1.95, o.z - 0.6], ry: o.ry }))
  inst(g.clone(), lam(0xe8e4d8), (o) => ({ p: [o.x + 3.1, 1.95, o.z - 0.6], ry: o.ry }))
}
// pompalar (2'şer)
{
  const g = new THREE.BoxGeometry(0.85, 1.35, 0.6)
  inst(g, lam(0xd64545), (o) => ({ p: [o.x - 1.5, 0.75, o.z - 0.6], ry: o.ry }))
  inst(g.clone(), lam(0xfaf6ec), (o) => ({ p: [o.x + 1.5, 0.75, o.z - 0.6], ry: o.ry }))
}
// market binası (krem) + kırmızı saçak
inst(new THREE.BoxGeometry(4.6, 2.5, 3.0), lam(0xfaf6ec), (o) => ({ p: [o.x + 2.4 * o.side, 1.25, o.z + 3.4], ry: 0 }))
inst(new THREE.BoxGeometry(4.9, 0.35, 3.3), lam(0xc94040), (o) => ({ p: [o.x + 2.4 * o.side, 2.62, o.z + 3.4], ry: 0 }))
// totem tabela
inst(new THREE.BoxGeometry(0.28, 3.4, 0.28), lam(0x8a8f96), (o) => ({ p: [o.x - 3.9, 1.7, o.z + 3.6], ry: 0 }))
inst(new THREE.BoxGeometry(1.7, 1.05, 0.3), lam(0xd64545), (o) => ({ p: [o.x - 3.9, 3.3, o.z + 3.6], ry: 0 }))

const meta = CELLS.map(c => { const w = toWorld(c); return { x: w.x + (rnd() - 0.5) * 1.6, z: w.z + (rnd() - 0.5) * 1.6, ry: (rnd() - 0.5) * 0.12, dz: rnd() < 0.5 ? 1 : -1, side: rnd() < 0.5 ? 1 : -1 } })
for (const part of parts) {
  for (let i = 0; i < TARGET; i++) {
    const t = part.place(meta[i])
    EU.set(0, t.ry, 0); QT.setFromEuler(EU); P.set(t.p[0], t.p[1], t.p[2])
    M4.compose(P, QT, SC); part.m.setMatrixAt(i, M4)
  }
  part.m.instanceMatrix.needsUpdate = true
}

// ---- ağaçlar (yazının dışına serpiştir) ----
{
  const N = 900
  const trunk = new THREE.InstancedMesh(new THREE.CylinderGeometry(0.25, 0.35, 1.6, 5), lam(0x7a5a3a), N)
  const crown = new THREE.InstancedMesh(new THREE.ConeGeometry(1.7, 3.4, 6), lam(0x4f7d3c), N)
  const occupied = new Set(CELLS.map(c => c.y * 10000 + c.x))
  let placed = 0, guard = 0
  while (placed < N && guard++ < 20000) {
    const gx = (rnd() * (pick.w * 1.75) - pick.w * 0.375) | 0, gy = (rnd() * (pick.h * 2.6) - pick.h * 0.8) | 0
    if (occupied.has(gy * 10000 + gx)) continue
    const x = (gx - pick.w / 2) * S + (rnd() - 0.5) * 9, z = (gy - pick.h / 2) * S + (rnd() - 0.5) * 9
    const sc = 0.8 + rnd() * 1.5
    EU.set(0, rnd() * 6.3, 0); QT.setFromEuler(EU); SC.set(sc, sc, sc)
    P.set(x, 0.8 * sc, z); M4.compose(P, QT, SC); trunk.setMatrixAt(placed, M4)
    P.set(x, (1.6 + 1.5) * sc, z); M4.compose(P, QT, SC); crown.setMatrixAt(placed, M4)
    placed++
  }
  SC.set(1, 1, 1); trunk.count = crown.count = placed
  scene.add(trunk, crown)
}

// ---- yollarda minik arabalar ----
{
  const N = 260
  const body = new THREE.InstancedMesh(new THREE.BoxGeometry(2.1, 0.75, 1.05), new THREE.MeshLambertMaterial(), N)
  const COLORS = [0xd64545, 0xfaf6ec, 0x4a7dbd, 0xe0b13e, 0x6d9155, 0x8a8f96]
  for (let i = 0; i < N; i++) {
    const horiz = rnd() < 0.5
    const lane = ((rnd() * pick.h * 1.6 - pick.h * 0.3) | 0)
    const along = (rnd() - 0.5) * W * 1.4
    const off = S / 2 + (rnd() < 0.5 ? -0.9 : 0.9)
    const x = horiz ? along : (((rnd() * pick.w * 1.2 - pick.w * 0.1) | 0) - pick.w / 2) * S + off
    const z = horiz ? (lane - pick.h / 2) * S + off : along
    EU.set(0, horiz ? 0 : Math.PI / 2, 0); QT.setFromEuler(EU)
    P.set(x, 0.45, z); M4.compose(P, QT, SC); body.setMatrixAt(i, M4)
    body.setColorAt(i, new THREE.Color(COLORS[(rnd() * COLORS.length) | 0]))
  }
  scene.add(body)
}

// ---- bulut katmanı (yükselirken içinden geçilir) ----
const clouds = []
{
  const mat = new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.82, depthWrite: false })
  for (let i = 0; i < 16; i++) {
    const grp = new THREE.Group()
    const n = 3 + (rnd() * 4 | 0)
    for (let k = 0; k < n; k++) {
      const m = new THREE.Mesh(new THREE.SphereGeometry(14 + rnd() * 22, 8, 6), mat)
      m.scale.y = 0.42; m.position.set((rnd() - 0.5) * 70, (rnd() - 0.5) * 8, (rnd() - 0.5) * 34)
      grp.add(m)
    }
    // yazının üstünü kapatmasın: merkezden en az W*0.30 uzağa doğ
    let px2 = 0, pz2 = 0
    do { px2 = (rnd() - 0.5) * W * 1.5; pz2 = (rnd() - 0.5) * W * 1.1 } while (Math.hypot(px2, pz2) < W * 0.30)
    grp.position.set(px2, 230 + rnd() * 200, pz2)
    grp.userData.v = 1.2 + rnd() * 1.6
    scene.add(grp); clouds.push(grp)
  }
}

// ---- kamera koreografisi ----
// başlangıç istasyonu: "3000"ün ilk sıfırının ortasına yakın bir hücre
const startCell = meta[(() => {
  let best = 0, bd = 1e9
  const tx = -pick.w * 0.08 * S, tz = pick.h * 0.22 * S
  meta.forEach((m, i) => { const d = (m.x - tx) ** 2 + (m.z - tz) ** 2; if (d < bd) { bd = d; best = i } })
  return best
})()]
const A = new THREE.Vector3(startCell.x, 0, startCell.z)
const CENTER = new THREE.Vector3(0, 0, -H * 0.04)
const END = CENTER.clone().add(new THREE.Vector3(0, W * 0.52, W * 0.31))
const smoother = u => u * u * u * (u * (u * 6 - 15) + 10)
const chipN = document.querySelector('#chip .n')
const chip = document.getElementById('chip'), fin = document.getElementById('final')
const fmt = new Intl.NumberFormat('tr-TR')

let t0 = null, stopped = false
function frame (now) {
  if (t0 === null) t0 = now
  let t = (now - t0) / 1000
  if (FREEZE !== null) t = FREEZE
  const HOLD = 2.6
  const u = t < HOLD ? 0 : Math.min(1, (t - HOLD) / DUR)
  const e = smoother(u)

  if (u === 0) { // 10 m'de istasyonun etrafında yavaş salınım
    const a = -0.5 + 0.22 * Math.sin(t * 0.55)
    cam.position.set(A.x + Math.sin(a) * 13, 10, A.z + Math.cos(a) * 13)
    cam.lookAt(A.x, 2.4, A.z)
  } else {
    // yükseklik log-uzayda → sabit algılanan hız
    const y = Math.exp(THREE.MathUtils.lerp(Math.log(10), Math.log(END.y), e))
    const ex = THREE.MathUtils.lerp(A.x + Math.sin(-0.5) * 13, END.x, smoother(Math.min(1, u * 1.25)))
    const ez = THREE.MathUtils.lerp(A.z + Math.cos(-0.5) * 13, END.z, smoother(Math.min(1, u * 1.25)))
    cam.position.set(ex, y, ez)
    const look = new THREE.Vector3().lerpVectors(new THREE.Vector3(A.x, 2.4, A.z), CENTER, smoother(Math.min(1, u * 1.5)))
    cam.lookAt(look)
    // son karede çok hafif nefes alma + yazıyı kadrajın üst yarısına al
    if (u >= 1) { cam.position.x += Math.sin(t * 0.3) * 6; cam.lookAt(CENTER.x, 0, CENTER.z + H * 0.16) }
  }

  chip.style.opacity = (u > 0.02 && u < 0.985) ? 1 : 0
  chipN.textContent = fmt.format(Math.round(TARGET * Math.pow(e, 1.35)))
  fin.style.opacity = u > 0.965 ? 1 : 0

  for (const c of clouds) { c.position.x += c.userData.v * 0.016; if (c.position.x > W * 0.8) c.position.x = -W * 0.8 }

  renderer.render(scene, cam)
  if (!stopped) requestAnimationFrame(frame)
}
requestAnimationFrame(frame)
addEventListener('keydown', ev => { if (ev.key === 'r' || ev.key === 'R') { t0 = null } })
addEventListener('pointerdown', () => { t0 = null })
</script>
</body>
</html>
